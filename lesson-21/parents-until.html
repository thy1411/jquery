<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery parentsUntil() Method</title>
    <link rel="stylesheet" href="parents-until.css">
</head>
<body>

    <h1>jQuery parentsUntil() Method</h1>

    <div class="ancestors">
        div (great-grandparent)

        <ul>
            ul (grandparent)

            <li>
                li (direct parent)
                <span>span</span>
            </li>
        </ul>
    </div>

    <button id="untilDiv">Parents Until DIV</button>
    <button id="filterUl">Parents Until DIV – Filter UL</button>
    <button id="untilBody">Parents Until BODY</button>

    <script src="../lesson-02/jquery-3.7.1.min.js"></script>
    <script src="parents-until.js"></script>
</body>
</html>
