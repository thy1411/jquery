<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery parent() Method</title>
    <link rel="stylesheet" href="parent.css">
</head>
<body>

    <h1>jQuery parent() Method</h1>

    <p>Click the button to highlight the direct parent of each span.</p>

    <div>
        <ul>
            <li>
                <span>Item 1</span>
            </li>
            <li>
                <span>Item 2</span>
            </li>
            <li>
                <span>Item 3</span>
            </li>
        </ul>
    </div>

    <button id="highlight">Highlight Parent Elements</button>

    <script src="../lesson-02/jquery-3.7.1.min.js"></script>
    <script src="parent.js"></script>
</body>
</html>
