<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery first(), last() and eq()</title>
    <link rel="stylesheet" href="first-last-eq.css">
</head>
<body>

    <h1>jQuery Filtering Methods</h1>

    <h2>First and Last Methods</h2>

    <div class="box">First DIV</div>
    <div class="box">Second DIV</div>
    <div class="box">Third DIV</div>

    <button id="firstDiv">Select First DIV</button>
    <button id="lastDiv">Select Last DIV</button>

    <h2>eq() Method</h2>

    <p>Paragraph 1</p>
    <p>Paragraph 2</p>
    <p>Paragraph 3</p>
    <p>Paragraph 4</p>

    <button id="secondParagraph">Select Second Paragraph</button>
    <button id="negativeIndex">Select Second Paragraph from End</button>

    <script src="../lesson-02/jquery-3.7.1.min.js"></script>
    <script src="first-last-eq.js"></script>
</body>
</html>
