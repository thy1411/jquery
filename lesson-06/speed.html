<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Hide Show Speed</title>

    <link rel="stylesheet" href="speed.css">

    <script src="../lesson-02/jquery-3.7.1.min.js"></script>
    <script src="speed.js"></script>
</head>
<body>

    <h1>jQuery Hide and Show - Speed</h1>

    <h2>Hide Speed</h2>

    <p id="slow">This paragraph uses slow speed.</p>
    <p id="fast">This paragraph uses fast speed.</p>
    <p id="milliseconds">This paragraph uses 1000 milliseconds.</p>

    <button id="hideSlow">Hide Slow</button>
    <button id="hideFast">Hide Fast</button>
    <button id="hideMilliseconds">Hide 1000ms</button>

    <hr>

    <h2>Show Speed</h2>

    <button id="showSlow">Show Slow</button>
    <button id="showFast">Show Fast</button>
    <button id="showMilliseconds">Show 1000ms</button>

</body>
</html>
