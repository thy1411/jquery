<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Events</title>

    <link rel="stylesheet" href="style.css">

    <script src="../lesson-02/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</head>
<body>

    <h1>jQuery Events</h1>

    <h2>1. Click Event</h2>

    <p>Nhấn chuột vào đoạn văn này để ẩn nó.</p>
    <p>Nhấn chuột vào đoạn văn này cũng để ẩn nó.</p>

    <hr>

    <h2>2. Double Click Event</h2>

    <p class="double-click">
        Nhấn đúp chuột vào đoạn văn này để ẩn nó.
    </p>

    <p class="double-click">
        Nhấn đúp chuột vào đoạn văn này cũng để ẩn nó.
    </p>

</body>
</html>
