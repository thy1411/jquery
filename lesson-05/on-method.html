<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery on() Method</title>

    <script src="../lesson-02/jquery-3.7.1.min.js"></script>

<body>

    <h1>jQuery on() Method</h1>

    <h2>1. Attach a Click Event</h2>

    <p id="clickExample">
        Nhấn vào đoạn văn này để ẩn nó.
    </p>

    <hr>

    <h2>2. Attach Multiple Events</h2>

    <p class="multipleEvents">
        Di chuyển chuột vào, di chuyển chuột ra hoặc nhấn vào đây.
    </p>

    <p class="multipleEvents">
        Thử các sự kiện trên với đoạn văn này.
    </p>
