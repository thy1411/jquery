<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Remove Specific Elements</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h2>Remove Specific Elements</h2>

    <button id="removeTestBtn">Remove Class Test</button>
    <button id="removeMultipleBtn">Remove Test and Demo</button>

    <div class="content">
        <p class="test">This paragraph has class test.</p>
        <p class="demo">This paragraph has class demo.</p>
        <p class="test">This is another test paragraph.</p>
        <p>This paragraph has no special class.</p>
    </div>

    <script src="../lesson-02/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
