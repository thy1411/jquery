<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery find() Method</title>
    <link rel="stylesheet" href="find.css">
</head>
<body>

    <h1>jQuery find() Method</h1>

    <div class="container">
        <p>Paragraph 1 - Direct Child</p>

        <section>
            <p>Paragraph 2 - Grandchild</p>

            <article>
                <p>Paragraph 3 - Great-grandchild</p>
            </article>
        </section>

        <div>
            <span>Span Element</span>
        </div>
    </div>

    <button id="findAll">Find All Descendants</button>
    <button id="findParagraphs">Find All Paragraphs</button>
    <button id="findAllElements">Find All Elements (*)</button>

    <script src="../lesson-02/jquery-3.7.1.min.js"></script>
    <script src="find.js"></script>
</body>
</html>
