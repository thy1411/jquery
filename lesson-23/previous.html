<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery Previous Sibling Methods</title>
    <link rel="stylesheet" href="previous.css">
</head>
<body>

    <h1>jQuery Previous Sibling Methods</h1>

    <div class="container">
        <p class="stop">Paragraph 1 (Stop)</p>
        <p>Paragraph 2</p>
        <p>Paragraph 3</p>
        <p id="selected">Paragraph 4 (Selected)</p>
        <p>Paragraph 5</p>
        <p>Paragraph 6</p>
    </div>

    <button id="showPrev">Show Previous Element</button>
    <button id="showPrevAll">Show All Previous Elements</button>
    <button id="showPrevUntil">Show Elements Until Paragraph 1</button>
    <button id="showPrevFilter">Show P Elements Until Paragraph 1</button>

    <script src="../lesson-02/jquery-3.7.1.min.js"></script>
    <script src="previous.js"></script>
</body>
</html>
