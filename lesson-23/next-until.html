<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>jQuery nextUntil() Method</title>
    <link rel="stylesheet" href="next-until.css">
</head>
<body>

    <h1>jQuery nextUntil() Method</h1>

    <div class="container">
        <p>Paragraph 1</p>
        <p id="selected">Paragraph 2 (Selected)</p>
        <p>Paragraph 3</p>
        <p>Paragraph 4</p>
        <span>Stop Here</span>
        <p>Paragraph 5</p>
    </div>

    <button id="showUntilSpan">Show Elements Until SPAN</button>
    <button id="showUntilSpanFilter">Show P Elements Until SPAN</button>

    <script src="../lesson-02/jquery-3.7.1.min.js"></script>
    <script src="next-until.js"></script>
</body>
</html>
